# Zentraler Workflow aus Exc3pt10n/ioBroker-workflows (Vorlage templates/test-and-release-npm.yml):
# Lint, Typprüfung, Build, Tests, Integrations- und Installationstest, npm audit, release-guard,
# nach einem Merge auf main das Release (Tag, GitHub-Release mit .tgz) und die Veröffentlichung auf npm.
name: Test and Release

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        # Wöchentlich mit voller Matrix (Linux + Windows, Node 22/24/26)
        - cron: '23 3 * * 1'
    workflow_dispatch:

# Neuer Push auf denselben Pull Request bricht den älteren Lauf ab; Läufe auf dem
# Standard-Branch laufen zu Ende, damit kein Release mittendrin abgebrochen wird
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    adapter:
        uses: Exc3pt10n/ioBroker-workflows/.github/workflows/adapter.yml@v1
        # Schreibrecht braucht nur der Release-Job (Tag, GitHub-Release)
        permissions:
            contents: write
        with:
            default-branch: main
            # TypeScript-Adapter: führt "npm run check" und "npm run build" aus
            build: true
            # Das .tgz am GitHub-Release ist genau das Paket, das auf npm landet
            prebuilt-package: true
            # Verteilung über npm bzw. das ioBroker-Repository: kein "prepare", common.nogit, höchstens 7 news
            npm-package: true
            # Kein Branch "release": ohne Build im Repository lässt er sich nicht aus GitHub installieren
            release-branch: ''
            # Ausgeliefert sind auch die Frontend-Quellen: src-www/ wird per Vite nach www/ gebaut.
            # Ohne diesen Eintrag verlangt der release-guard bei reinen Frontend-Änderungen keine neue Version.
            extra-runtime-paths: 'src/ src-www/'

    # Nach einem Release: das Paket vom GitHub-Release auf npm veröffentlichen (Trusted Publishing, kein Token)
    npm:
        needs: adapter
        if: needs.adapter.outputs.released == 'true'
        uses: Exc3pt10n/ioBroker-workflows/.github/workflows/npm-publish.yml@v1
        permissions:
            contents: read
            id-token: write
        with:
            version: ${{ needs.adapter.outputs.version }}
